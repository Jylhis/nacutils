name: SonarCloud

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  pull-requests: read

jobs:
  sonar:
    name: Scan
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Require SONAR_TOKEN
        if: ${{ env.SONAR_TOKEN == '' }}
        run: |
          echo "::error::SONAR_TOKEN is not configured. Add it in Settings → Secrets → Actions."
          echo "Setup: https://sonarcloud.io → My Projects → Analyze new project → Jylhis/nacutils"
          exit 1
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31
      - uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock', 'devenv.nix') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
      - name: Run tests with coverage
        run: nix develop --accept-flake-config --impure -c go test -coverprofile=coverage.out -covermode=atomic ./...
      - uses: SonarSource/sonarqube-scan-action@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
